analyzer:
  exclude:
    - build/**
  errors:
    unused_import: error
    unused_local_variable: error
    dead_code: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - use_super_parameters
