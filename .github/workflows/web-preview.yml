name: Flutter Web Full Game

on:
  push:
    branches:
      - main
      - agent/flutter-web-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test tool

      - name: Validate curated content
        run: dart run tool/validate_content.dart

      - name: Analyze project
        id: analyze
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyzer.log

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyzer-report
          path: analyzer.log
          if-no-files-found: error

      - name: Enforce analyzer success
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Run unit and widget tests
        id: tests
        continue-on-error: true
        run: flutter test 2>&1 | tee test-report.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-report
          path: test-report.log
          if-no-files-found: error

      - name: Enforce test success
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build full web shell
        run: flutter build web --release --target lib/full_main.dart --base-href "/suspect-impostor-game/"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
